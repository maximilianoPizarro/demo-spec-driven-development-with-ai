schemaVersion: 2.3.0
metadata:
  name: demo-spec-driven-development-with-ai
attributes:
  controller.devfile.io/storage-type: ephemeral  
components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:latest
      memoryLimit: 4Gi
      memoryRequest: 2Gi
      cpuRequest: 1000m
      cpuLimit: 4000m
      mountSources: true
      env:
        - name: PATH
          value: "/home/tooling/.sdkman/candidates/maven/current/bin:/home/tooling/.sdkman/candidates/java/current/bin:${PATH}"
        - name: MAVEN_HOME
          value: "/home/tooling/.sdkman/candidates/maven/current"
        - name: JAVA_HOME
          value: "/home/tooling/.sdkman/candidates/java/current"
        - name: JAVA_OPTS
          value: "-XX:MaxRAMPercentage=50.0 -XX:+UseParallelGC -XX:MinHeapFreeRatio=10 -XX:MaxHeapFreeRatio=20 -XX:GCTimeRatio=4 -XX:AdaptiveSizePolicyWeight=90 -Dsun.zip.disableMemoryMapping=true -Xms20m -Djava.security.egd=file:/dev/./urandom"
        - name: MAVEN_OPTS
          value: "${JAVA_OPTS}"
      volumeMounts:
        - name: config-volume
          path: /home/user/.config
        - name: m2-volume
          path: /home/user/.m2
  - name: config-volume 
    volume:
      size: 512Mi
  - name: m2-volume
    volume:
      size: 1Gi      
commands:
  - id: setup-jdk21
    exec:
      label: '1. Setup JDK 21'
      component: tools
      commandLine: 'bash -c "cd ${PROJECT_SOURCE} && chmod +x setup-jdk21.sh && ./setup-jdk21.sh"'
  - id: copyconfig
    exec:
      label: '2. Configure Continue AI and Konveyor'
      component: tools
      commandLine: 'bash -c "if [ -f ${PROJECT_SOURCE}/setup-continue-config.sh ]; then cd ${PROJECT_SOURCE} && chmod +x setup-continue-config.sh && ./setup-continue-config.sh; fi; if [ -f ${PROJECT_SOURCE}/setup-konveyor-config.sh ]; then cd ${PROJECT_SOURCE} && chmod +x setup-konveyor-config.sh && ./setup-konveyor-config.sh; fi"'
  - id: setup-keycloak-realm
    exec:
      label: '3. Setup Keycloak Realm'
      component: tools
      commandLine: 'bash -c "cd ${PROJECT_SOURCE} && chmod +x setup-keycloak-realm.sh && ./setup-keycloak-realm.sh"'
  - id: setup-wildfly-datasource
    exec:
      label: '4. Setup WildFly Datasource'
      component: tools
      commandLine: 'bash -c "cd ${PROJECT_SOURCE} && chmod +x setup-wildfly-datasource.sh && ./setup-wildfly-datasource.sh"'
  - id: build-coolstore
    exec:
      label: '5. Build Coolstore Application'
      component: tools
      workingDir: ${PROJECT_SOURCE}/coolstore
      commandLine: 'mvn clean install -DskipTests'
      group:
        kind: build
        isDefault: true
  - id: run-coolstore
    exec:
      label: '6. Run Coolstore Application'
      component: tools
      workingDir: ${PROJECT_SOURCE}/coolstore
      commandLine: 'mvn quarkus:dev'
      group:
        kind: run
        isDefault: true
  - id: deploy-k8s
    exec:
      label: '7. Deploy to Kubernetes/OpenShift'
      component: tools
      commandLine: 'bash -c "cd ${PROJECT_SOURCE} && chmod +x deploy-k8s.sh && ./deploy-k8s.sh"'
events:
  postStart:
    - copyconfig
