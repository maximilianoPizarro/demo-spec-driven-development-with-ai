schemaVersion: 2.3.0
metadata:
  name: demo-spec-driven-development-with-ai
attributes:
  controller.devfile.io/storage-type: ephemeral  
components:
  - name: tools
    container:
      image: quay.io/che-incubator/cli-ai-tools:latest
      memoryLimit: 10G
      memoryRequest: 2G
      cpuRequest: 1000m
      cpuLimit: 5000m
      volumeMounts:
        - name: completions
          path: /mnt/data/completions
        - name: confd
          path: /mnt/data/conf.d
        - name: functions
          path: /mnt/data/functions
        - name: config-volume
          path: /home/user/.config           
      endpoints:
        - exposure: public
          name: ra-aid
          protocol: https
          targetPort: 3000          
  - name: completions
    volume:
      size: 512Mi
  - name: confd
    volume:
      size: 512Mi
  - name: functions
    volume:
      size: 512Mi
  - name: config-volume 
    volume:
      size: 512Mi      
commands:
  - id: step1-generate-continue-config
    exec:
      label: '1. Generate Continue config from secret variables'
      component: tools
      commandLine: >
        bash -c '
        # Set default values if variables are not available
        LLM_SERVER_ID="${LLM_SERVER_ID:-llama-3-2-3b}"
        LLM_SERVER_URL="${LLM_SERVER_URL:-https://llama-3-2-3b-maas-apicast-production.apps.prod.rhoai.rh-aiservices-bu.com:443/v1}"
        
        # Create directory if it doesn'\''t exist
        mkdir -p /home/user/.continue || true
        
        # Generate config file
        cat > /home/user/.continue/config.json <<EOF
        {
          "models": [
            {
              "title": "MaaS ${LLM_SERVER_ID}",
              "model": "${LLM_SERVER_ID}",
              "apiBase": "${LLM_SERVER_URL}",
              "provider": "openai"
            }
          ],
          "tabAutocompleteModel": {
            "title": "MaaS ${LLM_SERVER_ID}",
            "provider": "openai",
            "model": "${LLM_SERVER_ID}"
          },
          "allowAnonymousTelemetry": false
        }
        EOF
        
        echo "Continue config generated successfully at /home/user/.continue/config.json"
        echo "Using LLM_SERVER_ID: ${LLM_SERVER_ID}"
        echo "Using LLM_SERVER_URL: ${LLM_SERVER_URL}"
        '
  - id: step2-ra-aid-gen-spec
    exec:
      label: '2. RA Aid gen with spec'
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: 'ra-aid --use-aider --cowboy-mode --show-cost --track-cost --msg-file spec.md --provider ${RA_AID_PROVIDER} --model ${RA_AID_MODEL}'
  - id: step3-ra-aid-server
    exec:
      label: '3. RA Aid run server'
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: 'ra-aid --server --server-host 0.0.0.0 --server-port 3000'
  - id: step4-clone-coolstore
    exec:
      label: '4. Clone Coolstore JavaEE to Quarkus demo'
      component: tools
      workingDir: ${PROJECT_SOURCE}
      commandLine: >
        bash -c '
        echo "Cloning Coolstore repository..."
        git clone https://github.com/konveyor-ecosystem/coolstore.git
        cd coolstore
        echo "Switching to partial-migration branch..."
        git checkout partial-migration
        echo "Coolstore repository cloned and switched to partial-migration branch successfully!"
        '
events:
  postStart:
    - step1-generate-continue-config     
