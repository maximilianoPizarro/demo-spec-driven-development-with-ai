schemaVersion: 2.3.0
metadata:
  name: demo-spec-driven-development-with-ai
attributes:
  controller.devfile.io/storage-type: ephemeral  
components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi8-latest
      memoryLimit: 4Gi
      memoryRequest: 2Gi
      cpuRequest: 1000m
      cpuLimit: 4000m
      mountSources: true
      volumeMounts:
        - name: config-volume
          path: /home/user/.config
      endpoints:
        - exposure: public
          name: coolstore
          protocol: http
          targetPort: 8080
  - name: postgres
    container:
      image: postgres:15
      memoryLimit: 1Gi
      memoryRequest: 512Mi
      env:
        - name: POSTGRES_USER
          value: postgresUser
        - name: POSTGRES_PASSWORD
          value: postgresPW
        - name: POSTGRES_DB
          value: postgresDB
        - name: POSTGRES_MULTIPLE_DATABASES
          value: keycloak
      volumeMounts:
        - name: postgres-data
          path: /var/lib/postgresql/data
      endpoints:
        - exposure: public
          name: postgres
          protocol: tcp
          targetPort: 5432
  - name: keycloak
    container:
      image: quay.io/keycloak/keycloak:20.0.5
      memoryLimit: 2Gi
      memoryRequest: 1Gi
      env:
        - name: KEYCLOAK_ADMIN
          value: admin
        - name: KEYCLOAK_ADMIN_PASSWORD
          value: admin
        - name: KC_DB
          value: postgres
        - name: KC_DB_URL_HOST
          value: postgres
        - name: KC_DB_URL_PORT
          value: "5432"
        - name: KC_DB_URL_DATABASE
          value: keycloak
        - name: KC_DB_USERNAME
          value: postgresUser
        - name: KC_DB_PASSWORD
          value: postgresPW
        - name: KC_HTTP_PORT
          value: "8081"
        - name: KC_HOSTNAME_STRICT
          value: "false"
        - name: KC_HOSTNAME_STRICT_HTTPS
          value: "false"
        - name: KEYCLOAK_URL
          value: http://keycloak:8081
      volumeMounts:
        - name: keycloak-data
          path: /opt/keycloak/data
      endpoints:
        - exposure: public
          name: keycloak
          protocol: http
          targetPort: 8081
  - name: wildfly
    container:
      image: quay.io/wildfly/wildfly:27.0.1.Final-jdk17
      memoryLimit: 2Gi
      memoryRequest: 1Gi
      env:
        - name: POSTGRES_HOST
          value: postgres
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          value: postgresDB
        - name: POSTGRES_USER
          value: postgresUser
        - name: POSTGRES_PASSWORD
          value: postgresPW
        - name: KEYCLOAK_URL
          value: http://keycloak:8081
      endpoints:
        - exposure: public
          name: wildfly
          protocol: http
          targetPort: 8080
        - exposure: public
          name: wildfly-mgmt
          protocol: http
          targetPort: 9990
  - name: config-volume 
    volume:
      size: 512Mi
  - name: postgres-data
    volume:
      size: 1Gi
  - name: keycloak-data
    volume:
      size: 1Gi      
commands:
  - id: setup-jdk17
    exec:
      label: '1. Setup JDK 17'
      component: tools
      commandLine: 'bash -c "cd ${PROJECT_SOURCE} && chmod +x setup-jdk17.sh && ./setup-jdk17.sh"'
  - id: copyconfig
    exec:
      label: '2. Configure Continue AI'
      component: tools
      commandLine: 'bash -c "if [ -f ${PROJECT_SOURCE}/setup-continue-config.sh ]; then cd ${PROJECT_SOURCE} && chmod +x setup-continue-config.sh && ./setup-continue-config.sh; else echo \"Warning: setup-continue-config.sh not found, skipping Continue config\"; fi"'
  - id: setup-keycloak-realm
    exec:
      label: '3. Setup Keycloak Realm'
      component: tools
      commandLine: 'bash -c "cd ${PROJECT_SOURCE} && chmod +x setup-keycloak-realm.sh && ./setup-keycloak-realm.sh"'
  - id: setup-wildfly-datasource
    exec:
      label: '4. Setup WildFly Datasource'
      component: tools
      commandLine: 'bash -c "cd ${PROJECT_SOURCE} && chmod +x setup-wildfly-datasource.sh && ./setup-wildfly-datasource.sh"'
  - id: build-coolstore
    exec:
      label: '5. Build Coolstore Application'
      component: tools
      workingDir: ${PROJECT_SOURCE}/coolstore
      commandLine: 'mvn clean install -DskipTests'
  - id: run-coolstore
    exec:
      label: '6. Run Coolstore Application'
      component: tools
      workingDir: ${PROJECT_SOURCE}/coolstore
      commandLine: 'mvn quarkus:dev'
events:
  postStart:
    - setup-jdk17
    - copyconfig
    - setup-keycloak-realm
    - setup-wildfly-datasource
