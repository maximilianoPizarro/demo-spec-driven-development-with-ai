schemaVersion: 2.3.0
metadata:
  name: demo-spec-driven-development-with-ai
attributes:
  controller.devfile.io/storage-type: ephemeral  
components:
  - name: tools
    container:
      image: quay.io/devfile/universal-developer-image:ubi8-latest
      memoryLimit: 4Gi
      memoryRequest: 2Gi
      cpuRequest: 1000m
      cpuLimit: 4000m
      mountSources: true
      volumeMounts:
        - name: config-volume
          path: /home/user/.config
      endpoints:
        - exposure: public
          name: coolstore
          protocol: http
          targetPort: 8080
  - name: config-volume 
    volume:
      size: 512Mi      
commands:
  - id: copyconfig
    exec:
      component: tools
      commandLine: 'mkdir -p /home/user/.continue && cp ${PROJECT_SOURCE}/continue-config.json /home/user/.continue/config.json'
  - id: build-coolstore
    exec:
      label: 'Build Coolstore application'
      component: tools
      workingDir: ${PROJECT_SOURCE}/coolstore
      commandLine: 'mvn clean install -DskipTests'
  - id: run-coolstore
    exec:
      label: 'Run Coolstore application'
      component: tools
      workingDir: ${PROJECT_SOURCE}/coolstore
      commandLine: 'mvn quarkus:dev'
events:
  postStart:
    - copyconfig
