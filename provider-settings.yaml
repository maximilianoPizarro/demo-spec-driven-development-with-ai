# This is a sample settings file generated by the extension with a few common providers
# and models defined.  To return the file back to default, delete it and restart vscode.
---
environment:
  ALWAYS_APPLIED_KEY: "envvar to be set regardless of which model is active"
  OPENAI_API_BASE: "${LLM_SERVER_URL}"
  OPENAI_API_KEY: "${LLM_SERVER_TOKEN}"

models:
  MaaSLlama: &active
    environment:
      OPENAI_API_KEY: "${LLM_SERVER_TOKEN}"
    provider: ChatOpenAI
    args:
      model: "${LLM_SERVER_ID}"
      configuration:
        baseURL: "${LLM_SERVER_URL}"

  OpenAI:
    environment:
      OPENAI_API_KEY: "" 
    provider: ChatOpenAI
    args:
      model: gpt-4o 

  AzureChatOpenAI:
    environment:
      AZURE_OPENAI_API_KEY: "" 
    provider: AzureChatOpenAI
    args:
      azureOpenAIApiDeploymentName: "" 
      azureOpenAIApiVersion: "" 

  AmazonBedrock:
    environment:
      AWS_ACCESS_KEY_ID: "" 
      AWS_SECRET_ACCESS_KEY: "" 
      AWS_DEFAULT_REGION: "" 
    provider: ChatBedrock
    args:
      model: meta.llama3-70b-instruct-v1:0 

  DeepSeek:
    environment:
      DEEPSEEK_API_KEY: "" 
    provider: ChatDeepSeek
    args:
      model: deepseek-chat 

  GoogleGenAI:
    environment:
      GOOGLE_API_KEY: "" 
    provider: ChatGoogleGenerativeAI
    args:
      model: gemini-2.5-pro 

  ChatOllama:
    provider: ChatOllama
    args:
      model: your-model-here 

  JustAnExample:
    environment:
      ANY_KEY_1: "any environment variable needed for this model provider"
    provider: "provider-string"
    args:
      anyArgumentName1: "argument one"
    template: "template string" 
    llamaHeader: "header string" 
    llmRetries: 5 
    llmRetryDelay: 10.0 

active: *active