apiVersion: apps/v1
kind: Deployment
metadata:
  name: wildfly
  namespace: coolstore
  labels:
    app: wildfly
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wildfly
  template:
    metadata:
      labels:
        app: wildfly
    spec:
      initContainers:
      - name: wait-for-postgres
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z postgres 5432; do echo waiting for postgres; sleep 2; done;']
      - name: wait-for-keycloak
        image: busybox:1.35
        command: ['sh', '-c', 'until nc -z keycloak 8081; do echo waiting for keycloak; sleep 2; done;']
      containers:
      - name: wildfly
        image: quay.io/wildfly/wildfly:27.0.1.Final-jdk17
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 9990
          name: management
        env:
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: wildfly-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          valueFrom:
            configMapKeyRef:
              name: wildfly-config
              key: POSTGRES_PORT
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: wildfly-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: wildfly-secret
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wildfly-secret
              key: POSTGRES_PASSWORD
        - name: KEYCLOAK_URL
          valueFrom:
            configMapKeyRef:
              name: wildfly-config
              key: KEYCLOAK_URL
        resources:
          requests:
            memory: 1Gi
            cpu: 500m
          limits:
            memory: 2Gi
            cpu: 1000m
        readinessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 60
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /
            port: 8080
          initialDelaySeconds: 90
          periodSeconds: 10

---
apiVersion: v1
kind: Service
metadata:
  name: wildfly
  namespace: coolstore
  labels:
    app: wildfly
spec:
  ports:
  - port: 8080
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 9990
    targetPort: 9990
    protocol: TCP
    name: management
  selector:
    app: wildfly

