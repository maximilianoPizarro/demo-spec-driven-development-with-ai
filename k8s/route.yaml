# OpenShift Route for WildFly
apiVersion: route.openshift.io/v1
kind: Route
metadata:
  name: wildfly
  namespace: coolstore
  labels:
    app: wildfly
spec:
  to:
    kind: Service
    name: wildfly
  port:
    targetPort: http
  tls:
    termination: edge
    insecureEdgeTerminationPolicy: Redirect

---
